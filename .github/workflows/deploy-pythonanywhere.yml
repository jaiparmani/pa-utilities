name: Deploy to PythonAnywhere

on:
  workflow_call:
    inputs:
      pa_working_dir:
        description: "Absolute path on the PA server to git pull in (e.g. /home/username/myproject)"
        required: true
        type: string
      pa_domain:
        description: "The PA webapp domain to reload (e.g. username.pythonanywhere.com)"
        required: true
        type: string
    secrets:
      PA_USERNAME:
        required: true
      PA_PASSWORD:
        required: true
      PA_API_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # apt's mirrors have repeatedly hung fetching noble-security/noble-updates
    # InRelease when installing chromium's OS deps on the plain ubuntu-latest
    # runner - even a retry loop kept hitting the same wall. Microsoft's
    # official Playwright image already has chromium and every OS dep baked
    # in, so there's no apt-get at runtime at all. Keep this tag in sync with
    # the playwright npm version installed below.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      # A reusable workflow's default checkout targets the CALLER's repo,
      # but deploy.js lives here in pa-utilities - check out this repo
      # explicitly regardless of who's calling.
      - uses: actions/checkout@v4
        with:
          repository: jaiparmani/pa-utilities
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install playwright@1.62.1

      - name: Pull latest code and reload webapp
        run: node deploy.js
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_WORKING_DIR: ${{ inputs.pa_working_dir }}
          PA_DOMAIN: ${{ inputs.pa_domain }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-error-screenshots
          path: |
            git-pull-error.png
            reload-error.png
          if-no-files-found: ignore
