name: Renew PythonAnywhere

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  renew:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install playwright@1.62.1

      - name: Renew PythonAnywhere
        run: node renew.js
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renew-error-screenshot
          path: renew-error.png
          if-no-files-found: ignore
